# Configuración de Jenkins como código (plugin configuration-as-code)
jenkins:
  systemMessage: "Jenkins del Gestor de Proyectos: compila los microservicios con JDK 21 y Maven 3.9.11"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

# Manage Jenkins > Tools
tool:
  jdk:
    installations:
      - name: "jdk-21"
        home: "/opt/java/openjdk"       # JDK 21 incluido en la imagen jenkins/jenkins:lts-jdk21
  maven:
    installations:
      - name: "maven-3.9"
        home: "/opt/maven"              # Maven 3.9.11 instalado en el Dockerfile

# Manage Jenkins > Credentials: los valores llegan desde el archivo .env, que no se sube a GitHub
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token"
              description: "Token de SonarQube para Jenkins"
              secret: "${SONAR_TOKEN}"
          - string:
              scope: GLOBAL
              id: "render-api-key"
              description: "Llave de API de Render (Terraform, despliegues y recolector de logs/métricas)"
              secret: "${RENDER_API_KEY}"
          - string:
              scope: GLOBAL
              id: "grafana-admin"
              description: "Contraseña del usuario admin de Grafana"
              secret: "${GRAFANA_ADMIN_PASSWORD}"

unclassified:
  location:
    url: "http://localhost:8090/"
  # Manage Jenkins > System > SonarQube servers (el nombre se usa en withSonarQubeEnv('SonarQube'))
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"

# Pipelines: backend (gestor-api), frontend (gestor-frontend), base de datos (gestor-basedatos),
# infraestructura en Render (gestor-infra) y pruebas de carga (gestor-rendimiento)
jobs:
  - script: >
      pipelineJob('gestor-infra') {
        description('Infraestructura como código: Terraform aprovisiona PostgreSQL, API y frontend en Render; Ansible configura la base, verifica los servicios y levanta el monitoreo - https://github.com/Pedro-Uriel-Perez/gestor-infra')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/Pedro-Uriel-Perez/gestor-infra.git') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
  - script: >
      pipelineJob('gestor-rendimiento') {
        description('Prueba de carga controlada con k6 contra la API y el frontend desplegados en Render (latencia p95, throughput y errores)')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/Pedro-Uriel-Perez/gestor-infra.git') }
                branch('*/main')
              }
            }
            scriptPath('rendimiento/Jenkinsfile')
          }
        }
      }
  - script: >
      pipelineJob('gestor-api') {
        description('API REST (Java 21 / Spring Boot 3) - https://github.com/Pedro-Uriel-Perez/gestor-api')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/Pedro-Uriel-Perez/gestor-api.git') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
  - script: >
      pipelineJob('gestor-frontend') {
        description('Frontend web (Java 21 / Spring Boot 3) - https://github.com/Pedro-Uriel-Perez/gestor-frontend')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/Pedro-Uriel-Perez/gestor-frontend.git') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
  - script: >
      pipelineJob('gestor-basedatos') {
        description('Base de datos PostgreSQL (dbgestor): análisis SQL con SQLFluff, migración, verificación de integridad, pruebas y escaneo de secretos')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/Pedro-Uriel-Perez/gestor-api.git') }
                branch('*/main')
              }
            }
            scriptPath('jenkins/basedatos.Jenkinsfile')
          }
        }
      }
