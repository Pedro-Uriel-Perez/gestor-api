# Levantar:   docker compose up -d --build      (desde la carpeta jenkins/)
# Jenkins:    http://localhost:8090   usuario: admin   contraseña: admin123
# SonarQube:  http://localhost:9000   usuario: admin   (la contraseña se cambia en el primer inicio)
# Los secretos van en el archivo .env, que no se sube a GitHub:
#   SONAR_TOKEN=...              token de SonarQube
#   RENDER_API_KEY=rnd_...       llave de API de Render (Terraform, despliegues y recolector de logs)
#   GRAFANA_ADMIN_PASSWORD=...   contraseña del usuario admin de Grafana
services:
  jenkins:
    build: .
    container_name: jenkins-gestor
    ports:
      - "8090:8080"       # el 8080 de Windows está ocupado
      - "50000:50000"
    environment:
      JENKINS_ADMIN_ID: admin
      JENKINS_ADMIN_PASSWORD: admin123
      SONAR_TOKEN: ${SONAR_TOKEN:-}
      RENDER_API_KEY: ${RENDER_API_KEY:-}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
    # El socket de Docker del equipo pertenece a root (grupo 0): Jenkins se agrega a ese grupo
    # para que Ansible levante el stack de monitoreo. Solo es aceptable en el equipo local del
    # administrador, porque da control total sobre Docker.
    group_add:
      - "0"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc.yaml:/var/jenkins_home/casc.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres-ci
      - sonarqube

  # Base de datos para las pruebas de la API dentro de Jenkins (se carga con los scripts del repo)
  postgres-ci:
    image: postgres:18
    container_name: postgres-ci
    environment:
      POSTGRES_DB: dbgestor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ../sql/postgres/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../sql/postgres/02_data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro

  # Servidor de análisis de calidad. Jenkins le envía el análisis (mvn sonar:sonar) y
  # SonarQube le responde el resultado del Quality Gate por webhook.
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
