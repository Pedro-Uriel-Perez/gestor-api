spring.application.name=Ejercicio5MyAPIGestor
# En Render el puerto llega en la variable PORT; en local se usa el 8081
server.port=${PORT:8081}
# PostgreSQL. stringtype=unspecified deja que Postgres convierta los String de las
# entidades a las columnas date/timestamp.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dbgestor?stringtype=unspecified}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# En la nube se apaga (SQL_EN_LOGS=false) para que los logs muestren solo eventos de la aplicación
spring.jpa.show-sql=${SQL_EN_LOGS:true}
# El esquema se crea con sql/postgres/01_schema.sql, Hibernate no lo modifica
spring.jpa.hibernate.ddl-auto=none

# Monitoreo (Actuator + Micrometer). Prometheus lee /actuator/prometheus; el histograma de
# http.server.requests permite calcular la latencia p95 con histogram_quantile.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=gestor-api
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Token que Prometheus manda como "Authorization: Bearer ..." (Terraform lo genera y lo pone en Render).
# Vacío = métricas abiertas, solo para desarrollo local.
metricas.token=${METRICAS_TOKEN:}
