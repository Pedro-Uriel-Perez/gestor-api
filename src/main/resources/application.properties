spring.application.name=Ejercicio5MyAPIGestor
server.port=8081
# PostgreSQL. stringtype=unspecified deja que Postgres convierta los String de las
# entidades a las columnas date/timestamp.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dbgestor?stringtype=unspecified}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
# El esquema se crea con sql/postgres/01_schema.sql, Hibernate no lo modifica
spring.jpa.hibernate.ddl-auto=none
