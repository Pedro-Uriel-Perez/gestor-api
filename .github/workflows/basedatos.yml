# Pipeline de BASE DE DATOS en la nube (GitHub Actions), sustituto del job gestor-basedatos de Jenkins:
# análisis estático con SQLFluff → base limpia → migración → re-ejecución → verificación de integridad
# (BD-01 a BD-10) → pruebas de la API contra la base nueva → escaneo de secretos con Trivy
name: Base de datos

on:
  push:
    branches: [main]
    paths: ["sql/**", ".sqlfluff", ".github/workflows/basedatos.yml"]
  pull_request:
    paths: ["sql/**", ".sqlfluff"]
  workflow_dispatch:

permissions:
  contents: read

# shell: bash explícito = bash -eo pipefail (un "| tee" no oculta los errores)
defaults:
  run:
    shell: bash

env:
  SQLFLUFF_VERSION: 4.5.0
  TRIVY_VERSION: 0.76.1
  PGHOST: localhost
  PGUSER: postgres
  BD: dbgestor_ci
  DB_URL: jdbc:postgresql://localhost:5432/dbgestor_ci?stringtype=unspecified

jobs:
  basedatos:
    name: SQLFluff, migración, integridad y pruebas
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          # Contenedor temporal de pruebas, solo accesible desde el runner: sin contraseña escrita
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Versiones
        run: |
          pip install --quiet --only-binary :all: "sqlfluff==${SQLFLUFF_VERSION}"
          psql --version
          sqlfluff --version
          psql -d postgres -tAc "SELECT version()"

      - name: Análisis estático SQL (SQLFluff)
        # Reglas en .sqlfluff (dialecto postgres). Falla si algún script tiene hallazgos.
        run: |
          sqlfluff lint sql/postgres --format json --write-output sqlfluff-reporte.json || true
          sqlfluff lint sql/postgres -v | tee sqlfluff-reporte.txt

      - name: Base de datos limpia
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS $BD WITH (FORCE)"
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $BD"

      - name: Migración (esquema y datos)
        run: |
          psql -d "$BD" -v ON_ERROR_STOP=1 -f sql/postgres/01_schema.sql
          psql -d "$BD" -v ON_ERROR_STOP=1 -f sql/postgres/02_data.sql

      - name: Re-ejecución de scripts (idempotencia)
        run: |
          psql -d "$BD" -v ON_ERROR_STOP=1 -q -f sql/postgres/01_schema.sql
          psql -d "$BD" -v ON_ERROR_STOP=1 -q -f sql/postgres/02_data.sql

      - name: Verificación de integridad (BD-01 a BD-10)
        run: psql -d "$BD" -v ON_ERROR_STOP=1 -f sql/postgres/05_verificacion_integridad.sql 2>&1 | tee verificacion-bd.txt

      - name: Pruebas de la API contra la base
        # Pruebas de integración JU-26 a JU-32 (conexión, login, altas y fechas) sobre la base recién creada
        run: mvn -B test -Dtest=ConexionPostgresTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: Escaneo de secretos y configuración (Trivy)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" trivy
          export PATH="$RUNNER_TEMP:$PATH"
          trivy fs --scanners secret,misconfig --skip-dirs target --skip-dirs .mvn --format table --output trivy-basedatos.txt .
          cat trivy-basedatos.txt
          trivy fs --scanners secret,misconfig --skip-dirs target --skip-dirs .mvn --severity HIGH,CRITICAL --exit-code 1 --quiet .

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reportes-basedatos
          path: |
            sqlfluff-reporte.*
            verificacion-bd.txt
            trivy-basedatos.txt
            target/surefire-reports/
